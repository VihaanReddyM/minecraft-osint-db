[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcosint"
version = "0.1.0"
description = "Minecraft OSINT CLI toolkit (modular skeleton)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "VA-Network" }]
dependencies = [
  "typer>=0.12.3",
  "httpx>=0.27.0",
  "tenacity>=8.2.3",
  "platformdirs>=4.2.2",
  "rich>=13.7.1",
  "psycopg[binary,pool]>=3.2.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]

[project.scripts]
mcosint = "mcosint.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Typer/Click CLIs commonly use `typer.Option(...)` in signatures.
ignore = ["B008"]
